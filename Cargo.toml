[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
edition = "2021"
authors = ["void"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Cortex-M 코어 런타임
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

# Embassy 비동기 임베디드 프레임워크
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-stm32 = { version = "0.2.0", features = ["stm32h743zi", "defmt", "memory-x", "unstable-pac", "time-driver-any", "exti"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.6.2", features = ["defmt"] }

# defmt 고속 RTT 로깅 및 패닉 핸들러
defmt = "0.3.10"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

# 공통 하드웨어 보드 패키지
nucleo-bsp = { path = "crates/nucleo-bsp" }

[profile.dev]
opt-level = "s"
debug = 2
lto = false
incremental = false

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
